name: IndexNow URL notifications

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages and verify IndexNow key
        env:
          INDEXNOW_KEY: 6048bbc9bce35885a5f456d88f36783c
        run: |
          for attempt in $(seq 1 24); do
            if [ "$(curl -fsS "https://monbonecran.fr/${INDEXNOW_KEY}.txt" 2>/dev/null | tr -d '\r\n')" = "${INDEXNOW_KEY}" ]; then
              echo "IndexNow key file is live."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment (${attempt}/24)..."
            sleep 10
          done
          echo "IndexNow key file was not available after 4 minutes."
          exit 1

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 6048bbc9bce35885a5f456d88f36783c
        run: |
          node <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urlList = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1].trim());
          if (!urlList.length) throw new Error('No URLs found in sitemap.xml');
          const payload = JSON.stringify({
            host: 'monbonecran.fr',
            key: process.env.INDEXNOW_KEY,
            keyLocation: 'https://monbonecran.fr/' + process.env.INDEXNOW_KEY + '.txt',
            urlList
          });
          fs.writeFileSync('/tmp/indexnow-payload.json', payload);
          console.log(`Submitting ${urlList.length} URLs to IndexNow.`);
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary '@/tmp/indexnow-payload.json'
