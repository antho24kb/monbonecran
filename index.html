<style>
/* Concept : style iOS, clair uniquement. Fond gris très pâle, cartes blanches arrondies, un seul bleu, grands titres, boutons en pilule. */
:root{
  --bg:#FF7A1A; --surface:#FFF6EE; --fg:#1D1D1F; --muted:#6E6E73; --line:rgba(60,60,67,.14);
  --accent:#E8590C; --violet:#7C3AED; --accent-fg:#FFFFFF; --soft:#F3EEFB; --track:#E5E5EA; --shadow:0 1px 2px rgba(0,0,0,.05);
  --f-display:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:17px; line-height:1.5; font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  padding-block:0 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.bars{display:none}
.panel{background:#fff; border-radius:28px; padding:20px 16px 18px; display:flex; flex-direction:column; gap:14px; box-shadow:0 10px 30px rgba(120,40,0,.25); margin-bottom:8px}
body{background:linear-gradient(180deg,#FF8A1F 0%,#F2540B 100%) fixed}
.card{border:1px solid rgba(255,122,26,.18)}
header{display:flex; flex-direction:column; gap:6px; padding-top:28px}
header .mark{display:none}
header.home{align-items:center; text-align:center; gap:10px; padding-top:44px; padding-bottom:10px}
header.home .mark{display:block; width:84px; height:84px; margin-bottom:6px}
header.home h1{font-size:clamp(3.4rem,17vw,5rem); line-height:.94; letter-spacing:-.02em; font-weight:800}
header.home h1 span{display:block}
header h1 .tv{color:#2E0E73}
header.home .sub{margin:10px auto 0; text-align:center; font-size:1.12rem; max-width:26ch; color:#fff}
header.home .pill{display:inline-block}
header .pill{display:none}
header.home .pill{margin-top:12px; padding:6px 14px; border-radius:99px; background:#fff; font-size:.82rem; font-weight:700; color:#5B21B6; letter-spacing:.02em}
h1{color:#FFFFFF; font-family:var(--f-display); font-weight:800; font-size:clamp(2.3rem,9vw,3rem); line-height:1.02; margin:0; letter-spacing:-.035em; text-wrap:balance}
.sub{margin:4px 0 0; color:#fff; font-size:1.08rem; line-height:1.45; max-width:34ch}
.progress{display:flex; gap:5px}
.progress[hidden]{display:none}
.progress span{flex:1; height:4px; border-radius:2px; background:var(--track)}
.progress span.on{background:var(--accent)}
.crumbs{font-size:.85rem; color:var(--muted); min-height:0}
h2{color:#5B21B6; padding-bottom:.08em; font-family:var(--f-display); font-weight:800; font-size:1.75rem; line-height:1.1; letter-spacing:-.03em; margin:6px 0 2px; text-wrap:balance}
.grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.grid.three{grid-template-columns:repeat(3, minmax(0,1fr))}
.list{display:flex; flex-direction:column; gap:10px}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.opt{
  background:var(--surface); border:none; padding:16px; text-align:left; box-shadow:var(--shadow);
  min-height:56px; border-radius:14px; font-weight:600; min-width:0; overflow-wrap:anywhere; position:relative;
}
.opt small{display:block; font-weight:400; color:var(--muted); font-size:.88rem; margin-top:3px; line-height:1.35}
.opt.has-ic{display:flex; align-items:center; gap:8px; padding:12px 10px}
.opt.has-ic > span:not(.ic){min-width:0; overflow-wrap:normal; word-break:normal; font-family:var(--f-display); font-weight:800; font-size:.98rem; letter-spacing:-.02em; background:linear-gradient(100deg,#6D28D9 0%,#F2540B 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em}
.opt .tc{font-family:var(--f-display); font-weight:800; font-size:1.1rem; letter-spacing:-.02em; background:linear-gradient(100deg,#7C3AED 0%,#FF7A1A 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em}
.usage b{background:linear-gradient(100deg,#5B21B6 0%,#E8590C 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em; width:fit-content}
.opt .mn{font-family:var(--f-display); font-weight:800; font-size:1.05rem; letter-spacing:-.02em; background:linear-gradient(100deg,#F2540B 0%,#7C3AED 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em}
.ic{flex:none; width:34px; height:34px; border-radius:11px; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:.82rem; letter-spacing:-.02em}
.ic svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.opt:active{background:var(--soft)}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.opt.sm{padding:12px 14px; min-height:54px; font-weight:500}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.usage{display:flex; flex-direction:column; gap:2px; padding:16px 40px 16px 18px}
.usage b{font-family:var(--f-display); font-size:1.15rem; font-weight:700; letter-spacing:-.015em}
.usage::after{content:"\203A"; position:absolute; right:18px; top:50%; transform:translateY(-52%); font-size:1.6rem; color:var(--muted); font-weight:400}
.row-actions{display:flex; gap:10px; flex-wrap:wrap}
.link{background:none; border:none; padding:6px 0; color:var(--accent); font-weight:400; text-align:left; font-size:1.05rem}
.btn{background:var(--accent); color:var(--accent-fg); border:none; padding:12px 24px; border-radius:980px; font-weight:500; display:inline-block}
.btn:active{opacity:.85}
.btn.ghost{background:var(--soft); color:var(--accent)}
.search{width:100%; font:inherit; color:var(--fg); background:var(--track); border:none; border-radius:12px; padding:12px 14px}
.search::placeholder{color:var(--muted)}
.year{font-family:var(--f-display); font-size:1.05rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; background:linear-gradient(100deg,#7C3AED 0%,#A855F7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; margin:10px 0 -2px 4px; padding-bottom:.1em; width:fit-content}
.year:first-of-type{margin-top:0}
.card{background:var(--surface); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:14px; min-width:0; box-shadow:var(--shadow)}
.path{font-family:var(--f-mono); font-size:.8rem; background:var(--soft); padding:10px 12px; border-radius:10px; overflow-wrap:anywhere}
.set{display:flex; flex-direction:column; gap:6px; padding-top:14px; border-top:1px solid var(--line)}
.set:first-of-type{border-top:none; padding-top:0}
.set-head{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.set-name{font-family:var(--f-display); font-weight:800; background:linear-gradient(100deg,#5B21B6 0%,#7C3AED 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em; letter-spacing:-.005em; line-height:1.35}
.set-val{font-family:var(--f-mono); font-size:.86rem; font-weight:500; text-align:right; min-width:0; overflow-wrap:break-word; word-break:normal; hyphens:none; flex:1 1 7.5rem; color:var(--fg)}
.set-head{flex-wrap:wrap; row-gap:4px}
.set-name{overflow-wrap:break-word; word-break:normal}
.set-head .set-name{flex:1 1 7rem}
.opt{overflow-wrap:break-word}
.meter{height:4px; border-radius:2px; background:var(--track); position:relative; overflow:hidden}
.meter i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:2px}
.note{font-size:.9rem; color:var(--muted); margin:0}
.tag{font-family:var(--f-display); font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; background:linear-gradient(100deg,#7C3AED 0%,#A855F7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; width:fit-content}
.ad{background:var(--soft); color:var(--muted); text-align:center; padding:22px 12px; font-size:.85rem; border-radius:14px}
@media (prefers-reduced-motion: no-preference){
  .meter i{transition:width .5s ease}
  .opt{transition:background .15s ease}
}

/* Thème clair : crème, pêche et lavande ; orange en couleur principale, violet pour les titres */
:root{--bg:#FFFAF6; --surface:#FFFFFF; --fg:#2A1B4D; --muted:#7A6E92; --line:rgba(90,50,160,.12); --accent:#F26A1B; --accent-fg:#fff; --soft:#F4EEFF; --track:#EBE3F7; --shadow:0 2px 10px rgba(110,60,200,.08); color-scheme:light}
body{background:radial-gradient(700px 420px at 0% -4%,#FFD9BF 0%,transparent 62%),radial-gradient(640px 420px at 104% 2%,#E4D7FF 0%,transparent 60%),#FFFAF6 fixed; color:var(--fg)}
.panel{background:none; box-shadow:none; padding:0; border-radius:0; margin:0}
.card{border:1px solid rgba(124,58,237,.1)}
.opt{border:1px solid rgba(124,58,237,.1)}
header h1,h1{color:#3B1A8F}
header h1 .tv{background:linear-gradient(100deg,#FF8A1F 0%,#F2540B 45%,#8B4DFF 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em}
.sub,header.home .sub{color:#6B5C8A}
header.home .pill{background:#fff; color:#6D28D9; border:1px solid rgba(124,58,237,.25)}
header.home .mark{filter:drop-shadow(0 8px 18px rgba(242,106,27,.3))}
h2{color:#3B1A8F; background:none; border-left:5px solid transparent; border-image:linear-gradient(180deg,#8B4DFF,#FF8A1F) 1; padding:0 0 .02em 12px; margin-left:0}
.crumbs{color:var(--muted)}
.ad{background:#fff; color:var(--muted); border:1px dashed rgba(124,58,237,.25)}
.progress span.on{background:linear-gradient(90deg,#FF8A1F,#8B4DFF)}
.ic{background:#F4EEFF; color:#F26A1B}
.year,.tag{background:linear-gradient(100deg,#8B4DFF 0%,#B58CFF 100%); -webkit-background-clip:text; background-clip:text}
@media (prefers-reduced-motion: no-preference){
  @keyframes inFwd{from{opacity:0; transform:translateX(34px)} to{opacity:1; transform:none}}
  @keyframes inBack{from{opacity:0; transform:translateX(-34px)} to{opacity:1; transform:none}}
  @keyframes popIn{from{opacity:0; transform:translateY(12px) scale(.97)} to{opacity:1; transform:none}}
  #stage.go-fwd > *{animation:inFwd .42s cubic-bezier(.2,.8,.2,1) both}
  #stage.go-back > *{animation:inBack .42s cubic-bezier(.2,.8,.2,1) both}
  #stage .grid .opt,#stage .list .opt{animation:popIn .45s cubic-bezier(.2,.8,.2,1) both}
  #stage .grid .opt:nth-child(1),#stage .list .opt:nth-child(1){animation-delay:.04s}
  #stage .grid .opt:nth-child(2),#stage .list .opt:nth-child(2){animation-delay:.08s}
  #stage .grid .opt:nth-child(3),#stage .list .opt:nth-child(3){animation-delay:.12s}
  #stage .grid .opt:nth-child(4),#stage .list .opt:nth-child(4){animation-delay:.16s}
  #stage .grid .opt:nth-child(5),#stage .list .opt:nth-child(5){animation-delay:.20s}
  #stage .grid .opt:nth-child(6),#stage .list .opt:nth-child(6){animation-delay:.24s}
  #stage .grid .opt:nth-child(n+7),#stage .list .opt:nth-child(n+7){animation-delay:.28s}
  #stage:not(.go-fwd):not(.go-back) .opt{animation:none}
  .opt{transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
  .opt:active{transform:scale(.97)}
  header{animation:popIn .5s cubic-bezier(.2,.8,.2,1) both}
}

/* Futuriste : verre dépoli, grille HUD, néons orange et violet, balayage laser entre les pages */
body{position:relative; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background-image:linear-gradient(rgba(124,58,237,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.07) 1px,transparent 1px);
  background-size:34px 34px; -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 78%); mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 78%)}
body::after{content:""; position:fixed; z-index:-1; pointer-events:none; width:520px; height:520px; left:-140px; top:-120px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,138,31,.35),transparent 65%); filter:blur(30px)}
.opt{background:linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,.78)) padding-box, linear-gradient(120deg,rgba(255,138,31,.7),rgba(139,77,255,.7)) border-box; border:1.5px solid transparent; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 6px 22px rgba(139,77,255,.10)}
.card{background:linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)) padding-box, linear-gradient(135deg,rgba(255,138,31,.6),rgba(139,77,255,.6)) border-box; border:1.5px solid transparent; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 10px 34px rgba(139,77,255,.14)}
.opt:hover{box-shadow:0 0 0 3px rgba(139,77,255,.12),0 10px 28px rgba(255,138,31,.25)}
.opt:active{background:linear-gradient(#FFF1E6,#FFF1E6) padding-box, linear-gradient(120deg,#FF8A1F,#8B4DFF) border-box}
h2{border-image:none; border-left:0; padding-left:0; position:relative; letter-spacing:-.025em}
h2::before{content:"// "; font-family:var(--f-mono); font-weight:500; font-size:.7em; letter-spacing:0; background:linear-gradient(90deg,#FF8A1F,#8B4DFF); -webkit-background-clip:text; background-clip:text; color:transparent; vertical-align:.12em}
h2::after{content:""; display:block; width:56px; height:3px; margin-top:8px; border-radius:3px; background:linear-gradient(90deg,#FF8A1F,#8B4DFF); box-shadow:0 0 12px rgba(139,77,255,.7),0 0 18px rgba(255,138,31,.5)}
header h1 .tv{background-size:200% 100%; filter:drop-shadow(0 0 14px rgba(255,138,31,.35))}
header.home h1{text-shadow:0 0 36px rgba(139,77,255,.18)}
.crumbs,.year,.tag,header.home .pill{font-family:var(--f-mono); letter-spacing:.06em; text-transform:uppercase}
.crumbs{font-size:.72rem}
header.home .pill{font-size:.72rem; font-weight:500; background:rgba(255,255,255,.7); backdrop-filter:blur(8px); border:1px solid rgba(139,77,255,.35); box-shadow:0 0 18px rgba(139,77,255,.2)}
.progress span.on{box-shadow:0 0 10px rgba(255,138,31,.7),0 0 14px rgba(139,77,255,.45)}
.ic{box-shadow:inset 0 0 0 1px rgba(139,77,255,.2),0 0 14px rgba(255,138,31,.2)}
header.home .mark{filter:drop-shadow(0 0 22px rgba(139,77,255,.5)) drop-shadow(0 8px 18px rgba(255,138,31,.4))}
#stage{position:relative}
@media (prefers-reduced-motion: no-preference){
  @keyframes drift{0%,100%{transform:translate(0,0)} 50%{transform:translate(70px,50px)}}
  @keyframes shift{0%,100%{background-position:0% 50%} 50%{background-position:100% 50%}}
  @keyframes sweep{0%{top:0; opacity:0} 12%{opacity:1} 100%{top:100%; opacity:0}}
  @keyframes futIn{from{opacity:0; transform:translateX(42px) scale(.97); filter:blur(10px)} to{opacity:1; transform:none; filter:none}}
  @keyframes futBack{from{opacity:0; transform:translateX(-42px) scale(.97); filter:blur(10px)} to{opacity:1; transform:none; filter:none}}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,31,0)} 50%{box-shadow:0 0 0 6px rgba(255,138,31,.12)}}
  body::after{animation:drift 14s ease-in-out infinite}
  header h1 .tv{animation:shift 6s ease-in-out infinite}
  #stage.go-fwd > *{animation:futIn .5s cubic-bezier(.2,.8,.2,1) both}
  #stage.go-back > *{animation:futBack .5s cubic-bezier(.2,.8,.2,1) both}
  #stage.go-fwd::before,#stage.go-back::before{content:""; position:absolute; left:-4px; right:-4px; height:3px; border-radius:3px; z-index:5; pointer-events:none;
    background:linear-gradient(90deg,transparent,#FF8A1F,#8B4DFF,transparent); box-shadow:0 0 16px 3px rgba(139,77,255,.6),0 0 22px 4px rgba(255,138,31,.45); animation:sweep .7s ease-out both}
  .progress span.on:last-of-type{animation:glowpulse 2.4s ease-in-out infinite}
}

/* Titre futuriste */
header h1{font-family:"Orbitron","Manrope",sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:.04em; font-size:clamp(1.25rem,6.6vw,1.65rem); line-height:1.1; white-space:nowrap}

  else if (act === "copy") {

      navigator.clipboard.writeText(copyText()).then(function () { done("Copié"); }, function () { done("Copie impossible"); });
    } catch (err) { done("Copie impossible"); }

  }
  if (act === "cpick" || act === "bgame") {
    var yy = window.pageYOffset;
    keepScroll = true; render(); keepScroll = false;

  }
  render();

});
